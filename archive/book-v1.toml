# Archived first outline. The active catalog follows the supplied 31-villain reference document.
[book]
title_zh = "反派书：通往自由理性之路"
title_en = "The Villain Book: A Road to Freedom and Reason"
short_title_zh = "反派书"
short_title_en = "The Villain Book"
subtitle_zh = "31 位反派，四种力量，一场关于自由与理性的反向练习"
subtitle_en = "Thirty-One Villains, Four Powers, and a Reverse Exercise in Freedom and Reason"
author_zh = "MonoBase"
author_en = "MonoBase"
edition = "0.1.0"
updated = "2026-11-10"
language = "zh-Hans"

description_zh = "通过 31 位流行文化反派，分析愿景、聚拢人心、实现目的与长期坚持这四种力量；再以自由与理性为标准，辨认能力何时变成支配。"
description_en = "A study of thirty-one popular-culture villains through four powers: vision, allegiance, execution, and persistence. Freedom and reason then serve as tests for discerning when capability turns into domination."

rights_zh = "保留所有权利。本书是对虚构人物与作品的评论性写作，不主张角色、商标或原作情节的所有权。出版前请由作者确认最终授权与许可方式。"
rights_en = "All rights reserved. This is critical writing about fictional characters and works; it claims no ownership of characters, trademarks, or source plots. The author should confirm final licensing before public release."

[[parts]]
id = "threshold"
title_zh = "入口"
title_en = "Threshold"
intro_zh = "先学会辨认力量，再决定是否使用它。"
intro_en = "Learn to recognize power before deciding whether to use it."

[[parts]]
id = "vision"
title_zh = "第一编　视野：他们看见怎样的世界"
title_en = "Part I · Vision: The World They See"
intro_zh = "愿景让行动获得方向，也可能把复杂现实压成单一答案。"
intro_en = "A vision gives action direction, and can also flatten a complex reality into one answer."

[[parts]]
id = "allegiance"
title_zh = "第二编　人心：别人为何跟随"
title_en = "Part II · Allegiance: Why Others Follow"
intro_zh = "追随从来不是纯粹的愚蠢。它常常回应恐惧、利益、身份与被看见的渴望。"
intro_en = "Followers are never merely foolish. Allegiance answers fear, interest, identity, and the hunger to be seen."

[[parts]]
id = "execution"
title_zh = "第三编　目的：怎样把意志变成现实"
title_en = "Part III · Execution: Turning Will into Reality"
intro_zh = "执行能力放大结果，也放大错误的边界条件。"
intro_en = "Execution magnifies outcomes, including the costs of mistaken boundary conditions."

[[parts]]
id = "persistence"
title_zh = "第四编　坚持：什么值得继续，什么必须停止"
title_en = "Part IV · Persistence: What to Continue, What to Stop"
intro_zh = "坚持可以是忠诚，也可以是拒绝学习。"
intro_en = "Persistence can be fidelity, or it can be a refusal to learn."

