title_en = "Shi Yi: Talent, Pressure, and Rivalry"
subtitle_zh = "宿敌不是反派标签；它也让我们看见，被比较塑形的人如何寻找自己的道路。"
subtitle_en = "A rival is not automatically a villain; rivalry also shows how comparison shapes a person's search for a path."

