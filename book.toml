[book]
title_zh = "反派书：通往自由理性之路"
title_en = "The Villain Book: A Road to Freedom and Reason"
short_title_zh = "反派书"
short_title_en = "The Villain Book"
subtitle_zh = "30 位反派，五种特质，一场关于个人力量与心理模式的深入学习"
subtitle_en = "Thirty Villains, Five Traits, and a Deep Study of Personal Power and Psychological Patterns"
author_zh = "MonoBase"
author_en = "MonoBase"
edition = "0.3.0"
updated = "2026-11-11"
language = "zh-Hans"

description_zh = "从网文、漫画与动画中的 30 位反派出发，把他们的个人力量与心理模式视为学习对象，观察坚定的意志力、缜密的计划、不可动摇的决心、众心一致的团队与充满野心的理想；再以自由与理性辨认哪些能力值得学习、边界又应设在哪里。"
description_en = "Beginning with thirty villains from web fiction, comics, and animation, this book studies their personal power and psychological patterns: unwavering will, rigorous plans, immovable resolve, cohesive teams, and ambitious ideals. Freedom and reason then help distinguish what can be learned from where a boundary must be drawn."

rights_zh = "保留所有权利。本书是对虚构人物与作品的评论性写作，不主张角色、商标或原作情节的所有权。出版前请由作者确认最终授权与许可方式。"
rights_en = "All rights reserved. This is critical writing about fictional characters and works; it claims no ownership of characters, trademarks, or source plots. The author should confirm final licensing before public release."

[[parts]]
id = "threshold"
title_zh = "入口"
title_en = "Threshold"
intro_zh = "先学会辨认力量，再决定是否使用它。"
intro_en = "Learn to recognize power before deciding whether to use it."

[[parts]]
id = "web-fiction"
title_zh = "第一编　网文界：目标、组织与规则"
title_en = "Part I · Web Fiction: Purpose, Organization, and Rules"
intro_zh = "长篇叙事把目标、耐心与代价放到极高倍率下，也把“只要继续就能赢”的诱惑放得更大。"
intro_en = "Long serial fiction magnifies purpose, patience, and cost, along with the temptation to believe that continuing is itself a form of winning."

[[parts]]
id = "comics"
title_zh = "第二编　漫画界：创伤、象征与镜像"
title_en = "Part II · Comics: Trauma, Symbol, and Mirror"
intro_zh = "漫画反派常在长期连载中变形，也因此暴露同一种力量在不同版本里能走向何处。"
intro_en = "Comic villains change across long-running continuities, revealing where the same power can lead under different versions and constraints."

[[parts]]
id = "animation"
title_zh = "第三编　动画界：欲望、命运与技术"
title_en = "Part III · Animation: Desire, Fate, and Technique"
intro_zh = "动画允许欲望被放大成世界尺度，也让观众更清楚地看见代价落在谁身上。"
intro_en = "Animation can magnify desire to a world scale while making it easier to see who bears the cost."

[[parts]]
id = "synthesis"
title_zh = "收束"
title_en = "Synthesis"
intro_zh = "把力量从支配中拆出来，改写成可以纠错、可以退出、可以共同承担的自由实践。"
intro_en = "Separate power from domination and redesign it as a practice that can be corrected, exited, and shared."

