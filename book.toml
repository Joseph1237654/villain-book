title_en = "Hun Tiandi: A Clan Ambition Built as a Long-Term Project"
subtitle_zh = "最危险的组织者不是最会喊口号的人，而是能把几代人的资源与怨恨接到同一目标上的人。"
subtitle_en = "The most dangerous organizer is not the loudest speaker, but the one who connects generations of resources and resentment to one goal."

