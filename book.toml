[book]
title_zh = "反派书：通往自由理性之路"
title_en = "The Villain Book: A Road to Freedom and Reason"
short_title_zh = "反派书"
short_title_en = "The Villain Book"
subtitle_zh = "九位人物，五种特质，一场关于个人力量与心理模式的深入学习"
subtitle_en = "Nine Villains, Five Traits, and a Deep Study of Personal Power and Psychological Patterns"
author_zh = "MonoBase"
author_en = "MonoBase"
edition = "2.0.0"
updated = "2026-11-11"
language = "zh-Hans"

description_zh = "从四部网文与五部漫画中的九位人物出发，把他们的个人力量与心理模式视为学习对象，观察坚定的意志力、缜密的计划、不可动摇的决心、众心一致的团队与充满野心的理想；再以自由与理性辨认哪些能力值得学习、边界又应设在哪里。"
description_en = "Beginning with nine figures from four web novels and five comics, this book studies their personal power and psychological patterns: unwavering will, rigorous plans, immovable resolve, cohesive teams, and ambitious ideals. Freedom and reason then help distinguish what can be learned from where a boundary must be drawn."

rights_zh = "保留所有权利。本书是对虚构人物与作品的评论性写作，不主张角色、商标或原作情节的所有权。出版前请由作者确认最终授权与许可方式。"
rights_en = "All rights reserved. This is critical writing about fictional characters and works; it claims no ownership of characters, trademarks, or source plots. The author should confirm final licensing before public release."

[[parts]]
id = "threshold"
title_zh = "入口"
title_en = "Threshold"
intro_zh = "先学会辨认力量，再决定是否使用它。"
intro_en = "Learn to recognize power before deciding whether to use it."

[[parts]]
id = "web-fiction"
title_zh = "第一编　网文：目标、耐心与代价"
title_en = "Part I · Web Fiction: Purpose, Patience, and Cost"
intro_zh = "四部网文把个人意志放进漫长、资源稀缺且规则残酷的世界。目标越大，越能看清一个人如何计算代价、安排时间，又如何处理自己与他人的关系。"
intro_en = "Four web novels place personal will inside long, resource-scarce worlds with brutal rules. The larger the goal, the more clearly we see how a person calculates cost, organizes time, and treats other people."

[[parts]]
id = "comics"
title_zh = "第二编　漫画：创伤、权力与自我"
title_en = "Part II · Comics: Trauma, Power, and the Self"
intro_zh = "五部漫画作品把创伤、身份和权力推到极端。它们让我们看见，一个人如何把自己的伤口变成目标，又如何用决心、团队与理想为这种目标争取合法性。"
intro_en = "Five comics push trauma, identity, and power to extremes. They show how a wound can become a goal, and how resolve, team cohesion, and ideals can lend that goal legitimacy."

[[parts]]
id = "synthesis"
title_zh = "收束"
title_en = "Synthesis"
intro_zh = "把力量从支配中拆出来，改写成可以纠错、可以退出、可以共同承担的自由实践。"
intro_en = "Separate power from domination and redesign it as a practice that can be corrected, exited, and shared."

