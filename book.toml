title_zh = "序：为什么向反派学习"
title_en = "Preface: Why Learn from Villains"
subtitle_zh = "理解他们的力量与心理模式，同时守住自由与理性的边界。"
subtitle_en = "Understand their power and psychology while preserving the boundaries of freedom and reason."

