subtitle_zh = "先看懂反派的个人力量与心理模式，再判断哪些能力值得学习，哪些边界不能放弃。"
subtitle_en = "First understand the villain's personal power and psychological patterns; then decide which capacities are worth learning and which boundaries must remain."

