title_en = "Han Li: Making Caution a Long-Term Strategy"
subtitle_zh = "在资源有限、强者环伺的世界里，谨慎不是退缩，而是一套把风险、耐心与退路都算进去的生存方法。"
subtitle_en = "In a world of scarce resources and stronger rivals, caution is not retreat; it is a method for calculating risk, patience, and a way out."

