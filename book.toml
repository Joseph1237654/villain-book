title_en = "Fang Yuan: Making Eternity the Only Coordinate"
subtitle_zh = "一个目标足够漫长的人，可以把关系、身份与道德都改写成可计算变量。"
subtitle_en = "A person with a sufficiently long goal can rewrite relationships, identity, and morality as calculable variables."

